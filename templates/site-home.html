<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>$title</title>
  <meta name="description" content="$description">
  <link rel="canonical" href="$canonical">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:url" content="$canonical">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#4DBD8C">
  <link rel="stylesheet" href="/assets/kozeni-tokens.v1.css">
  <link rel="stylesheet" href="/assets/kozeni-brand.v1.css?v=45.0">
  <link rel="stylesheet" href="/assets/kozeni-nav.v1.css?v=45.0">
  <link rel="stylesheet" href="/assets/kozeni-site-foundation.v1.css?v=45.0">
$site_runtime_head
  <script type="application/ld+json">$seo_jsonld</script>
  <script defer src="/assets/kozeni-foundation-menu.v1.js"></script>
</head>
<body class="foundation-body foundation-home">
  <a class="foundation-skip" href="#main">本文へ移動</a>
  <header class="kozeni-site-header"><div class="kozeni-site-nav"><a class="kozeni-site-brand" href="/"><img src="/assets/images/icon-192.png?v=xicon1" alt="" width="34" height="34" decoding="async"><span>スマホ小銭研究所</span></a><nav class="kozeni-main-nav" aria-label="主要カテゴリ">$main_nav</nav></div></header>
  <button class="foundation-menu-trigger" type="button" data-foundation-menu-toggle aria-label="メニューを開く" aria-expanded="false">メニュー</button>
  <aside class="foundation-side-menu" id="foundation-side-menu" data-foundation-menu aria-label="サイトメニュー" aria-hidden="true" inert>
    <a class="foundation-side-brand" href="/"><img src="/assets/images/icon-192.png?v=xicon1" alt="" width="42" height="42" decoding="async"><span>スマホ小銭研究所</span></a>
    <p class="foundation-side-caption">条件を見て、対象なら拾う。</p>
    $side_nav
  </aside>
  <main class="foundation-home-main" id="main">
    <section class="foundation-home-hero" aria-labelledby="home-title">
      <p class="foundation-eyebrow"><img src="/assets/kozeni-flask-mini.svg" alt="" width="34" height="34" decoding="async"><span>$eyebrow</span></p>
      <h1 id="home-title">$h1</h1>
      <p class="foundation-home-lead">$lead</p>
      <div class="foundation-proof-list" aria-label="運営方針">$proofs</div>
    </section>
    <section class="foundation-section" aria-labelledby="category-title">
      <header class="foundation-section-head"><p class="foundation-label">CATEGORY</p><h2 id="category-title">確認したいテーマから選ぶ</h2><p>一覧ページから条件を確認し、必要な場合だけ公式サイトや申込画面へ進みます。</p></header>
      <div class="foundation-category-grid">$categories</div>
    </section>
  </main>
  $footer
</body>
</html>
