<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>$title</title>
  <meta name="description" content="$description">
  <link rel="canonical" href="$canonical">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:url" content="$canonical">
  <meta property="og:type" content="article">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#0F7A55">
  <link rel="stylesheet" href="/assets/kozeni-brand.v1.css?v=41.13">
  <link rel="stylesheet" href="/assets/kozeni-nav.v1.css?v=nav2">
  <link rel="stylesheet" href="/assets/kozeni-return.v1.css?v=return3">
  <link rel="stylesheet" href="/assets/kozeni-account-opening.v1.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/icon-32.png?v=xicon1">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icon-192.png?v=xicon1">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png?v=xicon1">
  <link rel="manifest" href="/site.webmanifest?v=xicon1">
  <script type="application/ld+json">$seo_jsonld</script>
</head>
<body>
  <a class="account-skip" href="#main">本文へ移動</a>
  <header class="kozeni-site-header"><div class="kozeni-site-nav"><a class="kozeni-site-brand" href="/"><img src="/assets/images/icon-192.png?v=xicon1" alt="" width="34" height="34" decoding="async"><span>スマホ小銭研究所</span></a><nav class="kozeni-main-nav" aria-label="主要カテゴリ"><a href="/mobile-sim/">スマホ・回線</a><a href="/point-site/">ポイ活</a><a href="/credit-card/">クレカ</a><a class="is-active" aria-current="page" href="/account-opening/">口座</a><a href="/travel/">旅行・移動</a></nav></div></header>
  <nav class="kozeni-breadcrumb" aria-label="パンくず"><a href="/">ホーム</a><span aria-hidden="true">›</span><a href="/account-opening/">口座</a><span aria-hidden="true">›</span><span aria-current="page">$name</span></nav>
  <main class="account-page" id="main"><article class="account-content">
    <header class="account-hero"><p class="account-eyebrow">$eyebrow</p><h1>$h1</h1><p class="account-lead">$lead</p><div class="account-badges" aria-label="主なキーワード">$badges</div><p class="account-updated">情報確認日：<time datetime="$checked_at">$checked_at_display</time></p></header>
    <section class="account-panel" aria-labelledby="conclusion-title"><p class="account-label">先に結論</p><h2 id="conclusion-title">役割を分けて考える</h2><div class="account-conclusions">$conclusion_cards</div></section>
    <section class="account-panel" aria-labelledby="comparison-title"><h2 id="comparison-title">$comparison_title</h2><div class="account-table-wrap"><table class="account-table">$comparison_table</table></div></section>
    $sections
    <p class="account-note">$note</p>
    <section class="account-panel" aria-labelledby="next-title"><h2 id="next-title">次に見るなら</h2><div class="account-related">$next_link</div></section>
  </article></main>
  <footer class="account-footer"><div class="account-footer__inner"><nav aria-label="フッター"><a href="/account-opening/">口座一覧</a><a href="/policy/">PR表記</a><a href="/privacy/">プライバシー</a><a href="/about/">運営者情報</a><a href="/contact/">お問い合わせ</a></nav><p>© スマホ小銭研究所</p></div></footer>
  <nav class="kozeni-fixed-return" aria-label="一覧へ戻る"><a href="/account-opening/">← 口座一覧へ戻る</a></nav>
</body>
</html>
